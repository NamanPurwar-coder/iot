<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" fill="none" role="img" aria-labelledby="blinkyTitle">
  <title id="blinkyTitle">An Arduino board wired to a glowing LED on a breadboard</title>
