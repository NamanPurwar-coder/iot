<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" fill="none" role="img" aria-labelledby="roverTitle">
  <title id="roverTitle">A two-wheeled obstacle-avoiding rover with ultrasonic sensor eyes approaching a traffic cone</title>
  <defs>
    <linearGradient id="roverBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7fbf4"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="roverBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eaf2ff"/>
    </linearGradient>
    <radialGradient id="roverGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#b6f24a" stop-opacity=".75"/>
      <stop offset="1" stop-color="#b6f24a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="480" height="320" fill="url(#roverBg)"/>
  <g stroke="#79c7b2" stroke-width="2.5" stroke-linecap="round" opacity=".5">
    <path d="M-10 66h54l16 16h48"/>
    <path d="M490 112h-46l-16-16h-38"/>
    <path d="M22 240h30l14-14h28"/>
    <circle cx="114" cy="82" r="4" fill="#79c7b2" stroke="none"/>
    <circle cx="382" cy="96" r="4" fill="#79c7b2" stroke="none"/>
    <circle cx="90" cy="226" r="4" fill="#79c7b2" stroke="none"/>
  </g>
  <circle cx="72" cy="270" r="58" fill="#b6f24a" opacity=".12"/>
  <circle cx="432" cy="70" r="40" fill="#2f6bff" opacity=".07"/>

  <ellipse cx="238" cy="272" rx="180" ry="17" fill="#0f766e" opacity=".13"/>
  <path d="M20 274h440" stroke="#9bd8c8" stroke-width="4" stroke-linecap="round"/>

  <!-- motion lines -->
  <g stroke="#2f6bff" stroke-width="4.5" stroke-linecap="round" opacity=".5">
    <path d="M40 158h30"/>
    <path d="M26 180h38"/>
    <path d="M52 202h24"/>
  </g>

  <!-- antenna -->
  <path d="M248 122V82" stroke="#11263f" stroke-width="5" stroke-linecap="round"/>
  <circle cx="248" cy="74" r="11" fill="#b6f24a" stroke="#11263f" stroke-width="4"/>
  <circle cx="248" cy="74" r="32" fill="url(#roverGlow)"/>
  <g stroke="#13a06b" stroke-width="3" stroke-linecap="round">
    <path d="M272 58c5 5 5 12 0 17"/>
    <path d="M280 50c9 9 9 24 0 33"/>
  </g>

  <!-- wheels -->
  <g>
    <circle cx="156" cy="218" r="37" fill="#1f2937" stroke="#11263f" stroke-width="5"/>
    <circle cx="156" cy="218" r="16" fill="#cbd5e1" stroke="#11263f" stroke-width="3.5"/>
    <circle cx="156" cy="218" r="5" fill="#64748b"/>
    <path d="M138 196l8 8M166 240l8 8M124 224h10M178 224h10M144 218h4M164 218h4" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g>
    <circle cx="340" cy="218" r="37" fill="#1f2937" stroke="#11263f" stroke-width="5"/>
    <circle cx="340" cy="218" r="16" fill="#cbd5e1" stroke="#11263f" stroke-width="3.5"/>
    <circle cx="340" cy="218" r="5" fill="#64748b"/>
    <path d="M322 196l8 8M350 240l8 8M308 224h10M362 224h10M328 218h4M348 218h4" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- body -->
  <rect x="140" y="122" width="216" height="102" rx="26" fill="url(#roverBody)" stroke="#11263f" stroke-width="5"/>
  <rect x="152" y="186" width="192" height="20" rx="10" fill="#2f6bff" opacity=".92"/>
  <path d="M140 168h216" stroke="#d7e3f4" stroke-width="3"/>

  <!-- ultrasonic eyes -->
  <circle cx="204" cy="152" r="20" fill="#cbd5e1" stroke="#11263f" stroke-width="4"/>
  <circle cx="204" cy="152" r="10" fill="#1f2937"/>
  <circle cx="204" cy="152" r="4" fill="#94a3b8"/>
  <circle cx="284" cy="152" r="20" fill="#cbd5e1" stroke="#11263f" stroke-width="4"/>
  <circle cx="284" cy="152" r="10" fill="#1f2937"/>
  <circle cx="284" cy="152" r="4" fill="#94a3b8"/>
  <path d="M196 123c5-4 11-5 16-4M276 123c5-4 11-5 16-4" stroke="#8798ad" stroke-width="2.5" stroke-linecap="round"/>

  <!-- LED smile -->
  <path d="M228 196c6 6 18 6 24 0" stroke="#b6f24a" stroke-width="4" stroke-linecap="round"/>
  <circle cx="222" cy="183" r="3" fill="#b6f24a"/>
  <circle cx="258" cy="183" r="3" fill="#b6f24a"/>
  <circle cx="166" cy="142" r="4" fill="#94a3b8"/>
  <circle cx="330" cy="142" r="4" fill="#94a3b8"/>

  <circle cx="248" cy="242" r="12" fill="#11263f"/>
  <circle cx="248" cy="242" r="4" fill="#94a3b8"/>

  <!-- cone -->
  <ellipse cx="432" cy="272" rx="30" ry="6" fill="#b45309" opacity=".2"/>
  <path d="M432 194l25 74h-50z" fill="#ff8a3d" stroke="#11263f" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M417 238h30l6 18h-42z" fill="#f8fbff" stroke="#11263f" stroke-width="3.5"/>
  <rect x="402" y="266" width="60" height="9" rx="4" fill="#334155" stroke="#11263f" stroke-width="3"/>

  <!-- signal waves -->
  <g stroke="#2f6bff" stroke-width="3" stroke-linecap="round" opacity=".55">
    <path d="M368 152c8 8 8 20 0 28"/>
    <path d="M378 144c13 13 13 33 0 46"/>
  </g>

  <g fill="#2f6bff">
    <circle cx="72" cy="122" r="4"/>
    <circle cx="94" cy="106" r="2.5"/>
  </g>
  <path d="M404 152l10 10m0-10l-10 10" stroke="#ff6b5e" stroke-width="4" stroke-linecap="round"/>
</svg>
