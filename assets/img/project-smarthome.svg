<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" fill="none" role="img" aria-labelledby="homeTitle">
  <title id="homeTitle">A smart home connected by Wi-Fi to a phone dashboard</title>
  <defs>
    <linearGradient id="homeBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6f3ff"/>
      <stop offset="1" stop-color="#f5faff"/>
    </linearGradient>
    <linearGradient id="homeWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#edf5ff"/>
    </linearGradient>
    <linearGradient id="homeRoof" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b9bff"/>
      <stop offset="1" stop-color="#2f6bff"/>
    </linearGradient>
    <radialGradient id="homeWarm" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe28a" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffe28a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="480" height="320" fill="url(#homeBg)"/>
  <circle cx="424" cy="64" r="50" fill="#b6f24a" opacity=".16"/>
  <g fill="#fff" opacity=".9">
    <path d="M38 66c0-8 7-15 16-15 6 0 12 4 14 9 2-1 4-1 5-1 8 0 14 6 14 14H38z"/>
    <path d="M312 48c0-6 5-11 11-11 5 0 7 2 9 5 2-1 3-1 4-1 6 0 10 4 10 10h-34z"/>
  </g>
  <g stroke="#8dc4f5" stroke-width="2.5" stroke-linecap="round" opacity=".55">
    <path d="M-10 118h48l14 14h34"/>
    <path d="M490 92h-42l-14-14h-32"/>
    <circle cx="88" cy="132" r="4" fill="#8dc4f5" stroke="none"/>
    <circle cx="402" cy="78" r="4" fill="#8dc4f5" stroke="none"/>
  </g>

  <ellipse cx="220" cy="280" rx="180" ry="14" fill="#2f6bff" opacity=".08"/>
  <path d="M42 278h396" stroke="#bfd9ef" stroke-width="4" stroke-linecap="round"/>

  <!-- bushes -->
  <circle cx="112" cy="264" r="18" fill="#7ed957" stroke="#11263f" stroke-width="4"/>
  <circle cx="92" cy="270" r="12" fill="#b6f24a" stroke="#11263f" stroke-width="3.5"/>
  <circle cx="314" cy="264" r="16" fill="#7ed957" stroke="#11263f" stroke-width="4"/>
  <circle cx="332" cy="270" r="11" fill="#b6f24a" stroke="#11263f" stroke-width="3.5"/>

  <!-- house -->
  <rect x="96" y="140" width="204" height="130" rx="12" fill="url(#homeWall)" stroke="#11263f" stroke-width="5"/>
  <path d="M76 146L196 60l122 86z" fill="url(#homeRoof)" stroke="#11263f" stroke-width="5" stroke-linejoin="round"/>
  <path d="M96 146h204" stroke="#11263f" stroke-width="4"/>
  <path d="M164 77l32-23 32 23" stroke="#b6f24a" stroke-width="4" stroke-linecap="round"/>

  <!-- door -->
  <rect x="120" y="200" width="50" height="70" rx="6" fill="#ffd166" stroke="#11263f" stroke-width="4"/>
  <path d="M144 200v70" stroke="#e2a900" stroke-width="3"/>
  <rect x="130" y="210" width="18" height="22" rx="3" fill="#fff2c2" opacity=".8"/>
  <circle cx="161" cy="238" r="3.5" fill="#11263f"/>

  <!-- window with smart bulb -->
  <circle cx="252" cy="198" r="40" fill="url(#homeWarm)"/>
  <rect x="222" y="172" width="62" height="54" rx="8" fill="#ffe9a8" stroke="#11263f" stroke-width="4"/>
  <path d="M253 172v54M222 199h62" stroke="#11263f" stroke-width="3.5"/>
  <path d="M252 182v18" stroke="#11263f" stroke-width="3" stroke-linecap="round"/>
  <path d="M245 206a8 8 0 0 1 14 0c0 4-3 6-3 9h-8c0-3-3-5-3-9z" fill="#fff" stroke="#11263f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M248 219h8" stroke="#11263f" stroke-width="2.5" stroke-linecap="round"/>

  <!-- WiFi -->
  <circle cx="198" cy="64" r="6" fill="#b6f24a" stroke="#11263f" stroke-width="3"/>
  <g stroke="#8ed12c" stroke-width="5" stroke-linecap="round">
    <path d="M181 47c10-9 24-9 34 0"/>
    <path d="M169 34c18-16 40-16 58 0"/>
  </g>
  <path d="M198 64c-20-22-50-22-70 0" stroke="#8ed12c" stroke-width="3" stroke-dasharray="4 8" opacity=".7" stroke-linecap="round"/>

  <!-- phone -->
  <g>
    <rect x="346" y="104" width="94" height="170" rx="21" fill="#11263f" stroke="#11263f" stroke-width="4"/>
    <rect x="354" y="115" width="78" height="148" rx="13" fill="#f8fbff"/>
    <rect x="378" y="108" width="26" height="5" rx="2.5" fill="#334155"/>
    <circle cx="366" cy="126" r="3" fill="#20b26b"/>
    <path d="M376 124h18" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <rect x="364" y="136" width="58" height="24" rx="8" fill="#eaf2ff"/>
    <circle cx="402" cy="148" r="7" fill="#20b26b"/>
    <circle cx="414" cy="148" r="7" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M371 145h15" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <circle cx="382" cy="174" r="9" fill="#ffcc4d"/>
    <path d="M373 192h38" stroke="#11263f" stroke-width="4" stroke-linecap="round"/>
    <path d="M373 198h26" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <g fill="#b6f24a">
      <rect x="368" y="224" width="10" height="24" rx="4"/>
      <rect x="384" y="214" width="10" height="34" rx="4"/>
      <rect x="400" y="230" width="10" height="18" rx="4"/>
    </g>
    <path d="M366 240l14-10 14 4 14-14" stroke="#2f6bff" stroke-width="2.5" stroke-linecap="round" opacity=".5"/>
    <rect x="364" y="250" width="58" height="10" rx="5" fill="#eaf2ff"/>
  </g>

  <!-- connection -->
  <path d="M212 76c40 8 74 20 112 48" stroke="#2f6bff" stroke-width="3" stroke-dasharray="4 9" stroke-linecap="round" opacity=".6"/>
  <circle cx="286" cy="104" r="4" fill="#2f6bff"/>
  <circle cx="252" cy="88" r="3" fill="#8b5cf6"/>
  <path d="M316 96l8 8m0-8l-8 8" stroke="#ff6b5e" stroke-width="3.5" stroke-linecap="round"/>

  <circle cx="344" cy="66" r="4" fill="#2f6bff"/>
  <circle cx="62" cy="196" r="5" fill="#ffcc4d"/>
</svg>
